[project]
name = "narrative-embedding-movie-recommender"
version = "0.2.0"
description = "Single and multi-embedding movie recommendation research pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastembed>=0.7.4,<0.8",
    "httpx>=0.27",
    "numpy>=1.26,<2",
    "pandas>=2.2",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
labeler = [
    "torch>=2.5",
    "transformers>=4.48",
]

[project.scripts]
movie-labeler = "labeler.cli:main"
movie-reconstruct = "trainer.reconstruct:main"
movie-evaluate = "trainer.evaluate:main"
movie-web = "webapp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labeler", "trainer", "webapp"]
