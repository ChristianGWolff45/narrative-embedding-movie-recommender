<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 390" role="img" aria-labelledby="title desc">
<title id="title">Vector memory and artifact storage</title>
<desc id="desc">Memory for the real catalog and an 87,585-title synthetic projection compared with a 256-megabyte vector budget.</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
<text x="40.0" y="42.0" font-size="24" fill="#263238" font-weight="650" text-anchor="start">Vector memory and on-disk size</text>
<text x="40.0" y="68.0" font-size="13" fill="#627078" font-weight="400" text-anchor="start">The 87,585-title point is a synthetic projection, not a measured real catalog.</text>
<line x1="320.0" y1="116" x2="320.0" y2="245" stroke="#e2e4e1"/>
<text x="320.0" y="267.0" font-size="11" fill="#627078" font-weight="400" text-anchor="middle">0 MiB</text>
<line x1="459.0" y1="116" x2="459.0" y2="245" stroke="#e2e4e1"/>
<text x="459.0" y="267.0" font-size="11" fill="#627078" font-weight="400" text-anchor="middle">200 MiB</text>
<line x1="598.0" y1="116" x2="598.0" y2="245" stroke="#e2e4e1"/>
<text x="598.0" y="267.0" font-size="11" fill="#627078" font-weight="400" text-anchor="middle">400 MiB</text>
<line x1="737.1" y1="116" x2="737.1" y2="245" stroke="#e2e4e1"/>
<text x="737.1" y="267.0" font-size="11" fill="#627078" font-weight="400" text-anchor="middle">600 MiB</text>
<line x1="876.1" y1="116" x2="876.1" y2="245" stroke="#e2e4e1"/>
<text x="876.1" y="267.0" font-size="11" fill="#627078" font-weight="400" text-anchor="middle">800 MiB</text>
<line x1="498.0" y1="105" x2="498.0" y2="246" stroke="#b4563e" stroke-width="2" stroke-dasharray="5 5"/>
<text x="505.0" y="103.0" font-size="11" fill="#9b4935" font-weight="400" text-anchor="start">256 MiB vector budget</text>
<text x="40.0" y="163.0" font-size="13" fill="#263238" font-weight="500" text-anchor="start">Real catalog · 6,194 films</text>
<rect x="320" y="145" width="37.84" height="25" rx="4" fill="#236b69"/>
<text x="365.8" y="163.0" font-size="12" fill="#263238" font-weight="600" text-anchor="start">54.4 MiB</text>
<text x="40.0" y="227.0" font-size="13" fill="#263238" font-weight="500" text-anchor="start">Synthetic scale · 87,585 films</text>
<rect x="320" y="209" width="535.10" height="25" rx="4" fill="#b77742"/>
<text x="863.1" y="227.0" font-size="12" fill="#263238" font-weight="600" text-anchor="start">769.8 MiB</text>
<line x1="40" y1="294" x2="980" y2="294" stroke="#d9ddda"/>
<text x="40.0" y="324.0" font-size="13" fill="#263238" font-weight="600" text-anchor="start">Compressed artifact: 46.2 MiB (48.4 MB)</text>
<text x="40.0" y="348.0" font-size="12" fill="#53636a" font-weight="400" text-anchor="start">Single-vector member: 8.4 MiB · narrative members: 37.8 MiB · 4.49× single-vector size</text>
<text x="40.0" y="374.0" font-size="11" fill="#627078" font-weight="400" text-anchor="start">Benchmark process peak RSS: 990 MiB, including Python/runtime overhead; the plotted budget applies to vectors only.</text>
</svg>
