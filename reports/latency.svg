<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 440" role="img" aria-labelledby="title desc">
<title id="title">Recommendation latency on COMECH-2080</title>
<desc id="desc">Serial in-process p95 latency and HTTP p95 latency at 100 requests per second.</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
<text x="40.0" y="42.0" font-size="24" fill="#263238" font-weight="650" text-anchor="start">Latency at the 6,194-film catalog</text>
<text x="40.0" y="68.0" font-size="13" fill="#627078" font-weight="400" text-anchor="start">p95 response time · lower is better · in-process and HTTP paths use separate measurements</text>
<line x1="365.0" y1="100" x2="365.0" y2="374" stroke="#e2e4e1" stroke-width="1"/>
<text x="365.0" y="398.0" font-size="11" fill="#627078" font-weight="400" text-anchor="middle">0 ms</text>
<line x1="463.3" y1="100" x2="463.3" y2="374" stroke="#e2e4e1" stroke-width="1"/>
<text x="463.3" y="398.0" font-size="11" fill="#627078" font-weight="400" text-anchor="middle">2 ms</text>
<line x1="561.7" y1="100" x2="561.7" y2="374" stroke="#e2e4e1" stroke-width="1"/>
<text x="561.7" y="398.0" font-size="11" fill="#627078" font-weight="400" text-anchor="middle">4 ms</text>
<line x1="660.0" y1="100" x2="660.0" y2="374" stroke="#e2e4e1" stroke-width="1"/>
<text x="660.0" y="398.0" font-size="11" fill="#627078" font-weight="400" text-anchor="middle">6 ms</text>
<line x1="758.3" y1="100" x2="758.3" y2="374" stroke="#e2e4e1" stroke-width="1"/>
<text x="758.3" y="398.0" font-size="11" fill="#627078" font-weight="400" text-anchor="middle">8 ms</text>
<line x1="856.7" y1="100" x2="856.7" y2="374" stroke="#e2e4e1" stroke-width="1"/>
<text x="856.7" y="398.0" font-size="11" fill="#627078" font-weight="400" text-anchor="middle">10 ms</text>
<line x1="955.0" y1="100" x2="955.0" y2="374" stroke="#e2e4e1" stroke-width="1"/>
<text x="955.0" y="398.0" font-size="11" fill="#627078" font-weight="400" text-anchor="middle">12 ms</text>
<text x="40.0" y="142.0" font-size="13" fill="#263238" font-weight="500" text-anchor="start">Single vector · in process</text>
<rect x="365" y="125" width="6.35" height="22" rx="4" fill="#365f73"/>
<text x="379.4" y="142.0" font-size="12" fill="#37474f" font-weight="600" text-anchor="start">0.13 ms</text>
<text x="40.0" y="193.0" font-size="13" fill="#263238" font-weight="500" text-anchor="start">Narrative, equal weights · in process</text>
<rect x="365" y="176" width="15.42" height="22" rx="4" fill="#236b69"/>
<text x="388.4" y="193.0" font-size="12" fill="#37474f" font-weight="600" text-anchor="start">0.31 ms</text>
<text x="40.0" y="244.0" font-size="13" fill="#263238" font-weight="500" text-anchor="start">Narrative, random weights · in process</text>
<rect x="365" y="227" width="13.69" height="22" rx="4" fill="#42817d"/>
<text x="386.7" y="244.0" font-size="12" fill="#37474f" font-weight="600" text-anchor="start">0.28 ms</text>
<line x1="40" y1="266" x2="970" y2="266" stroke="#d9ddda"/>
<text x="40.0" y="295.0" font-size="13" fill="#263238" font-weight="500" text-anchor="start">Single vector · HTTP at 100 req/s</text>
<rect x="365" y="278" width="244.87" height="22" rx="4" fill="#365f73"/>
<text x="617.9" y="295.0" font-size="12" fill="#37474f" font-weight="600" text-anchor="start">4.98 ms</text>
<text x="40.0" y="346.0" font-size="13" fill="#263238" font-weight="500" text-anchor="start">Narrative · HTTP at 100 req/s</text>
<rect x="365" y="329" width="534.98" height="22" rx="4" fill="#236b69"/>
<text x="908.0" y="346.0" font-size="12" fill="#37474f" font-weight="600" text-anchor="start">10.88 ms</text>
<text x="40.0" y="430.0" font-size="11" fill="#627078" font-weight="400" text-anchor="start">HTTP run: 5 seconds at each offered rate; 100 req/s was the highest rate tested, with zero errors.</text>
</svg>
